<footer class="footer border-top py-2 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="text-muted d-flex align-items-center my-3">
            <span>
                <i>
                    <span class="en">Last updated: {{ "now" | date: "%b %Y" }}</span>
                    <span class="zh">最后更新：{{ "now" | date: "%Y年%-m月" }}</span>
                </i>
            </span>
            <span>
                &nbsp;&nbsp;{{ site.data.display.footer_text }}
                &copy; 2026 <span class="en">Mengxue Zhang</span><span class="zh">张梦雪</span>
            </span>
        </div>
    </div>
</footer>
