short_bio: >-
  <p>
    Earth-system AI researcher working at the intersection of physics-aware deep learning, probabilistic modeling, and uncertainty quantification. I hold a Ph.D. in Remote Sensing from the University of Valencia,
    where I developed hybrid AI methods for uncertainty-aware drought modeling. My research integrates physics and probabilistic inference into deep learning to improve model generalization, predictive reliability, and physical consistency.
  </p>
  <p>
    My future research aims to develop uncertainty-aware hybrid Earth-system models for robust prediction of climate extremes under changing climate conditions.
  </p>

